    :root{--paper:#f2ece2;--ink:#29251f;--muted:#776e63;--sand:#d9c4a5;--line:#cdbda8;--cream:#fffaf1;--brown:#70533b;--dark:#38322c;--accent:#9a754b;--sans:"Golos Text",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{min-width:320px;min-height:100%;margin:0}body{overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45}button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}button{border:0;cursor:pointer}a{text-decoration:none}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

<body>
  <header class="shell topbar"><button class="wordmark" id="home" type="button" aria-label="вернуться на главный экран"><img src="logo-glyph.svg" alt=""></button></header>
  <main class="shell stage-wrap"><section class="stage" id="stage" aria-label="qualbyy bio">
    <div class="hero"><h1 class="hero-title"><span>привет, я</span><img src="logo-glyph.svg" alt="логотип qualbyy"></h1><p class="hero-status" id="status"></p></div>

    <article class="object about" data-view="about">
      <button class="face" type="button" aria-label="Обо мне" aria-expanded="false"><span class="sheet"><strong>обо мне</strong><span class="teaser">заметки на полях</span></span><span class="caption">обо мне</span></button>
      <div class="panel" aria-hidden="true"><button class="shut" type="button">закрыть</button><h2>обо мне</h2><p id="about-copy"></p></div>
    </article>

    <article class="object stack" data-view="stack">
      <button class="face" type="button" aria-label="Стек" aria-expanded="false"><span class="sheet"><span class="clip"></span><strong>стек</strong><span class="teaser">то на чем я делаю проекты</span></span><span class="caption">технический лист</span></button>
      <div class="panel" aria-hidden="true"><button class="shut" type="button">закрыть</button><h2>стек</h2><div class="cols"><div><h3>инструменты</h3><dl id="stack-list"></dl></div><div><h3>сетап</h3><dl id="setup-list"></dl></div></div></div>
    </article>

    <article class="object projects" data-view="projects">
      <button class="face" type="button" aria-label="Проекты" aria-expanded="false"><span class="tab"></span><span class="folder"><strong>проекты</strong><span class="teaser">сделано из интереса</span></span><span class="caption">проекты</span></button>
      <div class="panel" aria-hidden="true"><button class="shut" type="button">закрыть</button><h2>проекты</h2><div id="project-list"></div></div>
    </article>

    <article class="object games" data-view="games">
      <button class="face" type="button" aria-label="Игры" aria-expanded="false"><span class="ticket"><strong>игры</strong><span class="teaser">вечера в цифровых мирах</span></span><span class="caption">игры</span></button>
      <div class="panel" aria-hidden="true"><button class="shut" type="button">закрыть</button><h2>игры</h2><div id="games-list"></div></div>
    </article>

    <article class="object links" data-view="links">
      <button class="face" type="button" aria-label="Ссылки" aria-expanded="false"><span class="card"><strong>ссылки</strong><span class="teaser">где меня найти</span><span class="index"><i>tg</i><i>gh</i><i>st</i></span></span><span class="caption">ссылки</span></button>

      <div class="panel" aria-hidden="true"><button class="shut" type="button">закрыть</button><h2>dni</h2><p>не по пути</p><div class="crossed" id="dni-list"></div></div>

  </section></main>
  <script src="data.js"></script><script>
    const $=s=>document.querySelector(s),stage=$('#stage');
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const glyphs={terminal:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="m7 9 3 3-3 3m5 0h4"/>',code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/>',spark:'<path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Zm7 12 .7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/>',bot:'<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 7V4m-4 8h.01m8 0h.01M8 16h8"/>',github:'<path d="M8 20c-4 1-4-2-5-2m10 4v-3.5c0-1 .1-1.4-.5-2 2.1-.2 4.3-1 4.3-4.5 0-1-.4-1.8-1-2.5.1-.2.4-1.2-.1-2.5 0 0-.8-.3-2.6 1a9 9 0 0 0-4.7 0c-1.8-1.3-2.6-1-2.6-1-.5 1.3-.2 2.3-.1 2.5-.6.7-1 1.5-1 2.5 0 3.5 2.2 4.3 4.3 4.5-.6.5-.6 1-.5 2V22"/>',phone:'<rect x="7" y="2.8" width="10" height="18.4" rx="2"/><path d="M10 5h4m-2 13.5h.01"/>',laptop:'<rect x="5" y="4" width="14" height="11" rx="1"/><path d="M3 19h18M8 19l1-2h6l1 2"/>',deck:'<path d="M5 17.5V8a3 3 0 0 1 3-3h7a4 4 0 0 1 4 4v8.5M5 17.5h14M8 9h.01m8 0h.01"/>',gamepad:'<path d="m7 9-2 1.5a5 5 0 0 0-1.8 5.8l.3.8a2 2 0 0 0 3.6.3l1.2-2h7.4l1.2 2a2 2 0 0 0 3.6-.3l.3-.8A5 5 0 0 0 19 10l-2-1H7Z"/><path d="M8 12v3m-1.5-1.5h3m7-.5h.01m2 2h.01"/>',headphones:'<path d="M4 14v-2a8 8 0 0 1 16 0v2m-16 0v4a2 2 0 0 0 2 2h1v-7H6a2 2 0 0 0-2 2Zm16 0v4a2 2 0 0 1-2 2h-1v-7h1a2 2 0 0 1 2 2Z"/>',project:'<path d="M3 7h7l2 2h9v10H3Z"/><path d="M3 7V5h7l2 2"/>',game:'<path d="M5 7h14a2 2 0 0 1 2 2v8a2 2 0 0 1-3.5 1.3L15 16H9l-2.5 2.3A2 2 0 0 1 3 17V9a2 2 0 0 1 2-2Z"/><path d="M8 10v4m-2-2h4m6-1h.01m2 2h.01"/>',telegram:'<path d="m21 3-4 18-6-6-4 2 1.5-5.5L21 3Z"/><path d="m8.5 11.5 8.5-6-6 8"/>',accounts:'<circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/>'};
    const icon=(name,cls='line-icon')=>`<svg class="${cls} icon-${name}" viewBox="0 0 24 24" aria-hidden="true">${glyphs[name]||glyphs.project}</svg>`;
    const asset=(name,cls='asset-icon')=>`<img class="${cls}" src="icons/${name}.svg" alt="">`;
    const stackAsset=i=>({окружение:'archlinux',стэк:'python',интересы:'vibecoding',недавнее:'bot',гитхаб:'github'}[i.cat]||'minimal-web');
    const setupAsset=i=>({телефон:'galaxy-s25',лаптоп:'acer-swift-1',приставка:'steam-deck',геймпад:'gamesir',наушники:'marshall-major-iv'}[i.key]||'minimal-web');
    const platformAsset=i=>({github:'github',steam:'steam',discord:'discord',xbox:'xbox',twitter:'x',tiktok:'tiktok'}[i.platform]||'minimal-web');
    const projectAsset=name=>({qplate:'qplate',mskmeetsgmd:'mskmeetsgmd',qsak:'qsak',gdlcheckbot:'gdlcheckbot','прочие проекты':'github'}[name]||'minimal-web');
    const projectDescription=name=>({qsak:'швейцарский нож всех форматов, компрессия файлов и удобный инструмент.',gdlcheckbot:'telegram-бот для проверки уровней, демонов и рекордов в demonlist.org с удобными инструментами.'}[name]||'');
    $('#status').textContent=BIO_DATA.status;$('#about-copy').textContent=BIO_DATA.about;
    $('#stack-list').innerHTML=BIO_DATA.stack.map(i=>`<div class="stack-item"><dt class="icon-label">${asset(stackAsset(i))}${esc(i.cat)}</dt><dd>${esc(i.list)}</dd></div>`).join('');
    $('#setup-list').innerHTML=BIO_DATA.setup.map(i=>`<div class="stack-item"><dt class="icon-label">${asset(setupAsset(i))}${esc(i.key)}</dt><dd>${esc(i.val)}${i.key==='лаптоп'?` <span class="upcoming">(lenovo legion r7000p с ртх 4060 и 16 гб озу)</span>`:''}</dd></div>`).join('');
    const projects=[];
    BIO_DATA.stack.forEach(i=>{if(i.links)i.links.forEach(l=>{const name=l.text.replace(/^@/,'');projects.push({name,desc:projectDescription(name)||i.list,url:l.url})});if(i.url&&i.cat!=='гитхаб')projects.push({name:i.cat,desc:i.list,url:i.url})});
    projects.push({name:'qplate',desc:'конструктор сайтов в моём собственном дизайн-коде',url:'https://qualbyy.github.io/qplate'});
    projects.push({name:'mskmeetsgmd',desc:'мой сайт для удобного просмотра информации по сходкам ГДшеров из Москвы',url:'https://qualbyy.github.io/mskmeetsgmd/'});
    const githubProject=BIO_DATA.stack.find(i=>i.cat==='гитхаб'&&i.url);if(githubProject)projects.push({name:'прочие проекты',desc:githubProject.list,url:githubProject.url});
    BIO_DATA.posts.forEach(p=>projects.push({name:p.title||'пост',desc:p.excerpt||p.date||'',url:p.url||''}));
    $('#project-list').innerHTML=projects.map(p=>`<div class="project">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noreferrer">${asset(projectAsset(p.name),'project-mark asset-icon')}${esc(p.name)}</a>`:`<span>${asset(projectAsset(p.name),'project-mark asset-icon')}${esc(p.name)}</span>`}<small>${esc(p.desc)}</small></div>`).join('');
    $('#games-list').innerHTML=BIO_DATA.games.map(g=>`<div class="game"><b>${esc(g.title)}${g.ign?` <em>· ${esc(g.ign)}</em>`:''}</b><small>${g.details?g.details.map(d=>`${esc(d.label)}: ${esc(d.val)}`).join(' · '):''}</small></div>`).join('');
    const copyIcon='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3h-7A2.5 2.5 0 0 0 3 5.5v7A2.5 2.5 0 0 0 5.5 15"/></svg>';
    const checkIcon='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
    const copyBtn=v=>`<button class="copy" type="button" data-copy="${esc(v)}" aria-label="скопировать ${esc(v)}" title="скопировать">${copyIcon}</button>`;
    $('#tg-list').innerHTML=BIO_DATA.telegram.map(i=>`<div class="row"><div class="row-main"><a class="tag" href="${esc(i.url)}" target="_blank" rel="noreferrer">${esc(i.tag)}</a>${copyBtn(i.url)}</div><small>${esc(i.desc||'')}</small></div>`).join('');
    $('#accounts-list').innerHTML=BIO_DATA.accounts.map(i=>`<div class="row acct"><div class="row-main"><span class="platform"><img class="platform-icon" src="icons/${platformAsset(i)}.svg" alt="">${esc(i.platform)}</span><span class="nick">${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noreferrer">${esc(i.value)}</a>`:`<span>${esc(i.value)}</span>`}${copyBtn(i.value)}</span></div></div>`).join('');
    $('#traits-list').innerHTML=BIO_DATA.traits.map(i=>`<span>${esc(i)}</span>`).join('');
    $('#dni-list').innerHTML=BIO_DATA.dni.map(i=>`<span>${esc(i)}</span>`).join('');
    let current=null;
    const setExpanded=(object,open)=>{object.querySelector('.face').setAttribute('aria-expanded',open);object.querySelector('.panel').setAttribute('aria-hidden',!open)};
    const flip=(from,to,rotation=0)=>{const dx=from.left+from.width/2-to.left-to.width/2,dy=from.top+from.height/2-to.top-to.height/2;return `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${from.width/to.width},${from.height/to.height}) rotate(${rotation}deg)`};
    const settle=(object)=>{clearTimeout(object._motion);object._motion=setTimeout(()=>{object.style.transition='none';object.style.transform='';requestAnimationFrame(()=>{object.style.transition=''})},570)};
    function closeStage(){stage.classList.remove('is-open');document.querySelectorAll('.object.active').forEach(o=>{clearTimeout(o._motion);clearTimeout(o._closing);o.classList.remove('closing');const from=o.getBoundingClientRect();o.classList.remove('active');const to=o.getBoundingClientRect();const matrix=getComputedStyle(o).transform;const parts=matrix.match(/matrix\(([^)]+)\)/);const values=parts?parts[1].split(',').map(Number):[];const rotation=values.length>1?Math.atan2(values[1],values[0])*180/Math.PI:0;o.classList.add('closing');setExpanded(o,false);o.style.transition='none';o.style.transform=flip(from,to,rotation);requestAnimationFrame(()=>{o.style.transition='transform .55s cubic-bezier(.22,1,.36,1)';o.style.transform='' });o._closing=setTimeout(()=>{o.classList.remove('closing');o.style.transform='';o.style.transition=''},570)});current=null}
    function openStage(object){if(current===object.dataset.view){closeStage();return}closeStage();clearTimeout(object._motion);clearTimeout(object._closing);object.classList.remove('closing');const from=object.getBoundingClientRect();current=object.dataset.view;object.classList.add('active');setExpanded(object,true);const to=object.getBoundingClientRect();object.style.transition='none';object.style.transform=flip(from,to);stage.classList.add('is-open');requestAnimationFrame(()=>{object.style.transition='transform .55s cubic-bezier(.22,1,.36,1)';object.style.transform='';settle(object)})}
    stage.addEventListener('click',e=>{if(e.target.closest('.shut')){closeStage();return}if(e.target.closest('.panel a'))return;const object=e.target.closest('.object');if(!object){closeStage();return}if(object.classList.contains('active'))return;openStage(object)});
    $('#home').addEventListener('click',closeStage);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStage()});
    document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;e.preventDefault();e.stopPropagation();const v=b.dataset.copy||'';
      const done=()=>{b.classList.add('copied');b.innerHTML=checkIcon;clearTimeout(b._copied);b._copied=setTimeout(()=>{b.classList.remove('copied');b.innerHTML=copyIcon},1400)};
      const fallback=()=>{const t=document.createElement('textarea');t.value=v;t.setAttribute('readonly','');t.style.cssText='position:fixed;opacity:0;pointer-events:none';document.body.appendChild(t);t.select();try{if(document.execCommand('copy'))done()}catch(_){ }t.remove()};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fallback);else fallback()});
  </script>
