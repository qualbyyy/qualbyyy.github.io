    let current=null,zCounter=2;const bumpZ=object=>{object.style.zIndex=++zCounter%800+2};

    const restorePositions=()=>{const stageRect=stage.getBoundingClientRect();Object.entries(savedPositions).forEach(([view,pos])=>{const object=stage.querySelector(`.object[data-view="${view}"]`);if(!object||!Number.isFinite(pos.x)||!Number.isFinite(pos.y))return;object.style.left=`${pos.x*100}%`;object.style.top=`${pos.y*100}%`})};

      face.addEventListener('pointerdown',e=>{if(current||e.button!==0)return;bumpZ(object);const stageRect=stage.getBoundingClientRect(),rect=object.getBoundingClientRect();const baseMatrix=getComputedStyle(object).transform.match(/matrix\(([^)]+)\)/);const baseValues=baseMatrix?baseMatrix[1].split(',').map(Number):[];drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,lastTime:performance.now(),centerX:rect.left+rect.width/2-stageRect.left,centerY:rect.top+rect.height/2-stageRect.top,baseRotation:rotationOf(object),baseScaleX:baseValues.length>0?Math.hypot(baseValues[0],baseValues[1]):1,baseScaleY:baseValues.length>3?Math.hypot(baseValues[2],baseValues[3]):1,moved:false};face.setPointerCapture(e.pointerId);object.classList.add('dragging');object.style.transition='none';e.preventDefault()});
